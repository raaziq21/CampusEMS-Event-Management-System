<div class="event-card">
  <!-- Card Media -->
  <div class="event-card-media">
    <img ng-src="{{event.image || 'https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800'}}" 
         alt="{{event.title}}" 
         class="event-card-img"
         onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1492684223066-81342ee5ff30?w=800';">
    <span class="event-card-category">{{event.category}}</span>
    <span class="event-card-status status-{{event.status}}">{{event.status}}</span>
  </div>

  <!-- Card Body -->
  <div class="event-card-body">
    <div class="event-card-date">
      <i class="far fa-calendar-alt"></i>
      <span>{{formatDate(event.date)}} • {{formatTime(event.date)}}</span>
    </div>

    <h3 class="event-card-title">
      <a ng-href="#!/events/{{event._id}}">{{event.title}}</a>
    </h3>

    <p class="event-card-desc">{{event.description}}</p>

    <!-- Meta -->
    <div class="event-card-meta">
      <div class="meta-row" title="{{event.location}}">
        <i class="fas fa-map-marker-alt" style="color: var(--danger); width: 14px;"></i>
        <span>{{event.location}}</span>
      </div>
      <div class="meta-row" ng-if="event.organizer">
        <i class="fas fa-user-tie" style="color: var(--primary); width: 14px;"></i>
        <span>Organizer: {{event.organizer.name}}</span>
      </div>
    </div>

    <!-- Card Footer -->
    <div class="event-card-footer">
      <div class="capacity-pill" ng-class="{'full': event.registeredCount >= event.capacity}">
        <i class="fas fa-users" style="margin-right: 0.25rem;"></i>
        <span>{{event.registeredCount || 0}} / {{event.capacity}} registered</span>
      </div>

      <a ng-href="#!/events/{{event._id}}" class="btn btn-outline-primary btn-sm">
        Details <i class="fas fa-arrow-right"></i>
      </a>
    </div>
  </div>
</div>
