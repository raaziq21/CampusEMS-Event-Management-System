<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-header">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.25rem;">
        <i class="fas fa-user-plus"></i>
      </div>
      <h2>Student Registration</h2>
      <p>Create a participant account to register for events</p>
    </div>

    <!-- Register Form -->
    <form ng-submit="register()" novalidate>
      <div class="form-group">
        <label class="form-label">Full Name *</label>
        <input type="text" 
               class="form-control" 
               ng-model="user.name" 
               placeholder="e.g. Aarav Patel" 
               required 
               autofocus>
      </div>

      <div class="form-group">
        <label class="form-label">College Email Address *</label>
        <input type="email" 
               class="form-control" 
               ng-model="user.email" 
               placeholder="student@ems.edu" 
               required>
      </div>

      <div class="form-group">
        <label class="form-label">Phone Number (Optional)</label>
        <input type="text" 
               class="form-control" 
               ng-model="user.phone" 
               placeholder="+91 98765 43210">
      </div>

      <div class="form-group">
        <label class="form-label">Password * (Min 6 characters)</label>
        <input type="password" 
               class="form-control" 
               ng-model="user.password" 
               placeholder="••••••••" 
               required>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password *</label>
        <input type="password" 
               class="form-control" 
               ng-model="user.confirmPassword" 
               placeholder="••••••••" 
               required>
      </div>

      <button type="submit" 
              class="btn btn-primary btn-lg" 
              style="width: 100%; margin-top: 0.5rem;"
              ng-disabled="submitting">
        <i class="fas fa-check"></i> {{submitting ? 'Creating Account...' : 'Complete Registration'}}
      </button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.9rem; color: var(--text-secondary);">
      Already have an account? 
      <a href="#!/login" style="font-weight: 600;">Sign in here</a>
    </div>
  </div>
</div>
