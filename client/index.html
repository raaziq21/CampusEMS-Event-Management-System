<!DOCTYPE html>
<html lang="en" ng-app="emsApp">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Event Management System | BCA Cybersecurity</title>
  
  <!-- Favicon / SVG Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Font Awesome 6 Icons (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />

  <!-- Custom CSS3 Design System -->
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Global Toast Alerts Component -->
  <app-alerts></app-alerts>

  <!-- Sticky Top Navigation Component -->
  <app-navbar></app-navbar>

  <!-- Main Dynamic View (AngularJS ng-view SPA Router) -->
  <div ng-view class="main-content"></div>

  <!-- Global Footer Component -->
  <app-footer></app-footer>

  <!-- ==================================================================== -->
  <!-- AngularJS 1.8.x Core & ngRoute                                       -->
  <!-- ==================================================================== -->
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
  <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular-route.min.js"></script>

  <!-- ==================================================================== -->
  <!-- Main AngularJS Application Module                                    -->
  <!-- ==================================================================== -->
  <script src="app/app.js"></script>

  <!-- Services -->
  <script src="app/services/alert.service.js"></script>
  <script src="app/services/auth.service.js"></script>
  <script src="app/services/event.service.js"></script>
  <script src="app/services/registration.service.js"></script>
  <script src="app/services/user.service.js"></script>

  <!-- Directives / Components -->
  <script src="app/components/navbar/navbar.directive.js"></script>
  <script src="app/components/footer/footer.directive.js"></script>
  <script src="app/components/alert/alert.directive.js"></script>
  <script src="app/components/loader/loader.directive.js"></script>
  <script src="app/components/event-card/event-card.directive.js"></script>

  <!-- Public & Auth Page Controllers -->
  <script src="app/views/public/home/home.controller.js"></script>
  <script src="app/views/public/events/events.controller.js"></script>
  <script src="app/views/public/event-detail/event-detail.controller.js"></script>
  <script src="app/views/public/about/about.controller.js"></script>
  <script src="app/views/public/contact/contact.controller.js"></script>
  <script src="app/views/auth/login/login.controller.js"></script>
  <script src="app/views/auth/register/register.controller.js"></script>

  <!-- Dashboard Overview Controllers -->
  <script src="app/views/dashboard/admin/overview/admin-overview.controller.js"></script>
  <script src="app/views/dashboard/organizer/overview/organizer-overview.controller.js"></script>
  <script src="app/views/dashboard/participant/overview/participant-overview.controller.js"></script>
  <script src="app/views/dashboard/profile/profile.controller.js"></script>

</body>
</html>
